<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link src="index.js" defer>
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="TwifTech Logo.png">
  <title>Profile Card</title>
</head>

<body>
  <article class="test-profile-card" data-testid="test-profile-card">


    <figure data-testid="test-user-figure">
      <img src="profile.png" alt="" class="test-user-avatar" data-testid="test-user-avatar">
    </figure>

    <div data-testid="test-user-name-and-hobbies-container" class="test-user-name-and-hobbies-container">
      <h2 data-testid="test-user-name" class="test-user-name">Benjamin Timothy, Nnaka</h2>

      <button data-testid="test-user-hobbies-and-dislike-button"
        class="test-user-hobbies-and-dislike-button">Hobbies/Dislikes</button>
      <div data-testid="test-user-time" class="test-user-time"></div>
    </div>


    <p data-testid="test-user-bio" class="test-user-bio">Frontend Developer, Researcher, passionate about elegant
      UI, performance, and
      innovation in digital products.</p>

    <div data-testid="test-user-hobbies-and-dislikes-container" class="test-user-hobbies-and-dislikes-container">
      <div data-testid="test-user-hobbies">
        <ul>
          <h3>Likes</h3>
          <li>Researching</li>
          <li>Music</li>
          <li>Playing football</li>
          <li>Trading</li>
        </ul>

      </div>

      <div data-testid="test-user-dislikes">
        <ul>
          <h3>Dislikes</h3>
          <li>Dishonesty</li>
          <li>Procrastination</li>
          <li>Stagnancy</li>
          <li>Early gratification</li>
        </ul>
      </div>
    </div>

    <section data-testid="test-user-social-links" class=" test-user-social-links">
      <ul data-testid=" test-user-social-links" class="test-user-social-links  test-user-socials">

        <li>
          <a href="https://x.com/TBEN47" data-testid="test-user-social-twitter"
            class="test-user-social-twitter test-user-socials" target="_blank">

            <img src="Twitter_logo.png" alt="Twitter logo" data-testid="test-user-social-twitter"
              class="test-user-social-twitter">
          </a>
        </li>

        <li>
          <a href=" https://www.linkedin.com/in/nnaka-benjamin-timothy-40b237b1/"
            data-testid="test-user-social-linkedIn" class="test-user-social-linkedIn test-user-socials" target="_blank">

            <img src="linkedin_logo.png" alt="Linkedin Logo" class="test-user-social-linkedIn">
          </a>

        </li>
        <li>
          <a href="https://www.tiktok.com/@t_benofficial?lang=en" data-testid="test-user-social-Tiktok"
            class="test-user-social-Tiktok test-user-socials" target="_blank">
            <img src="tik-tok_logo.png" alt="tiktok logo" class="test-user-social-Tiktok">
          </a>
        </li>
      </ul>
    </section>

  </article>


</body>
<script src="index.js">  </script>

</html>
